<!DOCTYPE html>
<html lang="en">
<head>

<body style="font-family: Arial, sans-serif; background-color: #ffffff; padding: 20px;">

  <!-- بداية التوقيع -->

    <tr>
      <!-- الشعار المتحرك -->
      <td style="padding-right: 15px; vertical-align: middle;">
        <img src="./logo.gif" alt="Logo" width="130" style="display: block; border: 0;" />
      </td>
      
      <!-- الخط الفاصل العمودي والبيانات الشخصية -->
      <td style="border-left: 1.5px solid #888888; padding-left: 15px; vertical-align: top; text-align: left;">
        <div style="font-size: 16px; font-weight: bold; color: #444444; margin-bottom: 4px;">Abdullah AL-Ashtal</div>
        <div style="color: #666666; margin-bottom: 8px;">Operations Specialist</div>
        <div style="color: #777777; margin-bottom: 4px;">M: +966571556044</div>
        <div style="color: #777777; max-width: 360px;">
          Address: Office No. 26, 1st Floor, Synergy Building, Anas Ibn Malik Street, Riyadh, Saudi Arabia
        </div>
      </td>
    </tr>
    
    <!-- الشريط السفلي الملون -->
    <tr>
      <td colspan="2" style="padding-top: 12px;">
        <table cellpadding="0" cellspacing="0" width="100%" style="height: 3px; border-collapse: collapse;">
          <tr>
            <td width="25%" style="background-color: #0073b7; height: 3px;"></td>
            <td width="25%" style="background-color: #f39c12; height: 3px;"></td>
            <td width="25%" style="background-color: #0073b7; height: 3px;"></td>
            <td width="25%" style="background-color: #f39c12; height: 3px;"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <!-- نهاية التوقيع -->

</body>
</html>
